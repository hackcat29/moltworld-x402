version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: moltworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moltworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moltworld_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-moltworld}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moltworld} -d ${POSTGRES_DB:-moltworld}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moltworld-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-moltworld_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-moltworld_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: moltworld_postgres_data
  redis_data:
    name: moltworld_redis_data
