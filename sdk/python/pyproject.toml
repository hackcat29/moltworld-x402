[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moltworld"
version = "1.0.0"
description = "Pay-per-request AI on Algorand: x402 client for Moltworld with spend limits and receipt verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["py-algorand-sdk>=2.6", "pynacl>=1.5"]

[tool.setuptools]
packages = ["moltworld"]
