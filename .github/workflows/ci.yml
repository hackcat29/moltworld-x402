name: Moltworld CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, unit, e2e and interop tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moltworld
          POSTGRES_PASSWORD: moltworld
          POSTGRES_DB: moltworld_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moltworld" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install py-algorand-sdk pynacl
      - run: pnpm install --frozen-lockfile
      - name: Typecheck gateway and SDK
        run: pnpm build
      - name: Unit, e2e and interop tests (PGlite)
        run: pnpm test
      - name: Payment e2e tests on PostgreSQL 16
        env:
          DATABASE_URL: postgres://moltworld:moltworld@127.0.0.1:5432/moltworld_test
        run: pnpm vitest run tests/payments.e2e.test.ts --no-file-parallelism

  ui:
    name: UI tests (desktop, tablet, phones; light and dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.56.1 install --with-deps chromium
      - name: Run UI suite
        run: pnpm test:ui
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-artifacts/
          retention-days: 14

  deploy:
    name: Deploy origin (VPS)
    needs: [test, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/moltworld

            # Ensure native PostgreSQL is installed and active
            if ! command -v psql >/dev/null; then
              apt-get update && apt-get install -y postgresql postgresql-contrib
              systemctl enable --now postgresql
            else
              systemctl is-active --quiet postgresql || systemctl start postgresql
            fi

            # Auto-provision missing secrets in .env if absent
            if [ -f .env ]; then
              if ! grep -q '^POSTGRES_PASSWORD=.' .env; then
                echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
              fi
              if ! grep -q '^RECEIPT_SIGNING_KEY=.' .env; then
                echo "RECEIPT_SIGNING_KEY=$(openssl rand -base64 32)" >> .env
              fi
              if ! grep -q '^DATABASE_URL=.' .env; then
                PG_PW=$(grep '^POSTGRES_PASSWORD=' .env | tail -1 | cut -d= -f2-)
                echo "DATABASE_URL=postgres://moltworld:${PG_PW}@127.0.0.1:5432/moltworld" >> .env
              fi

              # Ensure PostgreSQL role and database exist
              PG_PW=$(grep '^POSTGRES_PASSWORD=' .env | tail -1 | cut -d= -f2-)
              sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'moltworld'" | grep -q 1 || \
                sudo -u postgres psql -c "CREATE USER moltworld WITH PASSWORD '$PG_PW';"
              sudo -u postgres psql -c "ALTER USER moltworld WITH PASSWORD '$PG_PW';"
              sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'moltworld'" | grep -q 1 || \
                sudo -u postgres psql -c "CREATE DATABASE moltworld OWNER moltworld;"
              sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE moltworld TO moltworld;"
            fi

            # Stop legacy docker containers if running
            if command -v docker >/dev/null 2>&1; then
              docker stop moltworld-postgres moltworld-redis 2>/dev/null || true
            fi

            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm build
            cp deploy/moltworld.service /etc/systemd/system/moltworld.service
            systemctl daemon-reload
            systemctl restart moltworld
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3402/health | grep -q '"ready":true'; then
                echo "Gateway healthy"; exit 0
              fi
              sleep 2
            done
            echo "Gateway did not become healthy:"; curl -s http://127.0.0.1:3402/health || true
            journalctl -u moltworld -n 60 --no-pager
            exit 1

  edge:
    name: Cloudflare Worker (pass-through)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy pass-through Worker
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify:
    name: Verify public endpoint
    needs: [edge]
    runs-on: ubuntu-latest
    steps:
      - name: Health, catalog, 402 challenge, receipt keys, A2A and MCP
        run: |
          set -e
          base=https://moltworld.xyz
          for i in $(seq 1 12); do
            health=$(curl -fsS $base/health || true)
            if echo "$health" | grep -q '"version":"3.0.0"' && echo "$health" | grep -q '"ready":true'; then break; fi
            echo "waiting for $base ($i/12)"; sleep 10
          done
          echo "$health" | jq '{status, network, ledger, enabled_models, receipts, payouts_enabled}'
          echo "$health" | jq -e '.ready and .ledger == "postgres" and .receipts.persistent_key and (.mock_providers | not)'
          curl -fsS $base/v1/models | jq -e '.data | length > 0'
          code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt $base/v1/models/gpt/chat/completions \
            -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}],"max_tokens":50}')
          test "$code" = 402 && grep -qi '^payment-required:' headers.txt
          curl -fsS $base/.well-known/moltworld-receipts.json | jq -e '.keys | length > 0'
          curl -fsS $base/a2a -H 'Content-Type: application/json' -H 'A2A-Version: 1.0' \
            --data '{"jsonrpc":"2.0","id":1,"method":"SendMessage","params":{"message":{"messageId":"ci","role":"ROLE_USER","parts":[{"text":"list image models","mediaType":"text/plain"}]}}}' \
            | jq -e '.result.message.parts[0].text | length > 0'
          curl -fsS $base/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q quote_request
