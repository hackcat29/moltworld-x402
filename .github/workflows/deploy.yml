name: Deploy to Contabo VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm build

      - name: Run Test Suite
        env:
          MOCK_PROVIDERS: "true"
          ALGORAND_NETWORK: "testnet"
          AVM_ADDRESS: "XFYEO7VOP3KX2YHZLQBQLM6L565IQJWYZGNG36OF44GYW5FF2FQXURFR7Q"
          FACILITATOR_URL: "https://facilitator.goplausible.xyz"
          PUBLIC_DOMAIN: "https://moltworld.xyz"
        run: pnpm test

  deploy:
    name: Deploy to Contabo
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT }}
          script_stop: true
          script: |
            set -e
            echo "======================================================"
            echo " Moltworld Automated Contabo Deployment Pipeline"
            echo "======================================================"
            
            cd /opt/moltworld
            
            echo "Step 1: Fetching latest commit from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Step 2: Installing production dependencies..."
            pnpm install --frozen-lockfile
            
            echo "Step 3: Compiling TypeScript into dist/..."
            pnpm build
            
            echo "Step 4: Restarting moltworld systemd daemon..."
            systemctl restart moltworld
            
            echo "Step 5: Verifying health check on port 3402..."
            READY=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3402/health > /dev/null 2>&1; then
                READY=1
                break
              fi
              echo "Waiting for gateway initialization ($i/15)..."
              sleep 1
            done

            if [ "$READY" -eq 1 ]; then
              echo ">>> SUCCESS: Moltworld is active, healthy, and serving requests on port 3402!"
            else
              echo ">>> ERROR: Gateway failed to report healthy within 15s. Printing journal logs:"
              journalctl -u moltworld -n 30 --no-pager
              exit 1
            fi

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # wrangler 4 requires Node >= 22; the test and verify jobs never execute it.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Worker holds the moltworld.xyz/* route, so it serves public traffic
      # ahead of the VPS origin. Without this step the edge keeps serving an
      # older build while the VPS deploy above reports success.
      - name: Deploy Worker to moltworld.xyz
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify-public:
    name: Verify Public Endpoint
    needs: [deploy, deploy-worker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm build

      # Asserts against the public URL, not localhost: a localhost-only check
      # cannot detect an edge layer serving a stale build.
      - name: Assert moltworld.xyz serves the current model catalog
        run: |
          EXPECTED=$(node -e "import('./dist/models/registry.js').then(m => console.log(m.defaultModelRegistry.getEnabledModels().length))")
          echo "Repository defines $EXPECTED enabled models."

          ACTUAL=""
          for i in $(seq 1 12); do
            ACTUAL=$(curl -fsS https://moltworld.xyz/health | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).enabled_models))" || echo "unreachable")
            echo "Attempt $i/12: https://moltworld.xyz/health reports $ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo ">>> SUCCESS: public endpoint is serving the current catalog ($ACTUAL models)."
              exit 0
            fi
            sleep 10
          done

          echo ">>> ERROR: moltworld.xyz reports $ACTUAL enabled models, expected $EXPECTED."
          echo "    The VPS origin and the Cloudflare Worker both serve this domain."
          echo "    Compare them to find which layer is stale:"
          echo "      curl -sk https://95.111.229.139/health -H 'Host: moltworld.xyz'   # origin"
          echo "      curl -s  https://moltworld.xyz/health                             # edge"
          exit 1

      - name: Verify public A2A and MCP integrations
        run: |
          curl -fsS https://moltworld.xyz/.well-known/agent-card.json |
            node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const x=JSON.parse(s);if(x.supportedInterfaces?.[0]?.url!=='https://moltworld.xyz/a2a')process.exit(1)})"
          curl -fsS https://moltworld.xyz/a2a \
            -H 'Content-Type: application/json' -H 'A2A-Version: 1.0' \
            --data '{"jsonrpc":"2.0","id":1,"method":"SendMessage","params":{"message":{"messageId":"deploy-check","role":"ROLE_USER","parts":[{"text":"list image models","mediaType":"text/plain"}]}}}' |
            node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const x=JSON.parse(s);if(!x.result?.message?.parts?.[0]?.text?.includes('image'))process.exit(1)})"
          curl -fsS https://moltworld.xyz/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' |
            node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{if(!s.includes('submit_signed_request')||!s.includes('get_payment_requirements'))process.exit(1)})"
          curl -fsS https://moltworld.xyz/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_payment_requirements","arguments":{"model":"gpt"}}}' |
            node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const x=JSON.parse(s.split('data: ')[1].split('\n')[0]);const q=JSON.parse(x.result.content[0].text);if(q.status!==402||!q.paymentRequired)process.exit(1)})"
